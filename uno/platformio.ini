; PlatformIO — ESP32-S3-Touch-LCD-3.5 + RC522
; Board setting setara Arduino IDE:
;   ESP32S3 Dev Module, Flash 16MB, PSRAM OPI, Partition 16M Flash (3MB APP/9.9MB FATFS)

[env:esp32-s3-touch-lcd-3.5]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    mfrc522/MFRC522@^1.4.11
    bblanchon/ArduinoJson@^7.2.0
    moononournation/GFX Library for Arduino@^1.5.5

monitor_speed = 115200
upload_speed = 921600
